name: Event Password Lockout E2E Test

on:
  pull_request:

jobs:
  e2e-lockout:
    name: Run event password lockout e2e test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e test
        run: bun run test:e2e:lockout
