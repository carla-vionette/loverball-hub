# Event Password Lockout — E2E
#
# Runs scripts/test-event-password-lockout.ts on every PR. The job name
# "event-password-lockout-e2e" is intentionally stable so it can be marked
# as a required status check in GitHub branch protection:
#
#   Settings → Branches → Branch protection rules → main → Require status
#   checks to pass → search for "event-password-lockout-e2e" and check it.
#
# Versions are pinned (no `latest`) to keep CI deterministic. Bump them in a
# dedicated PR so any behavior change is reviewable in isolation.
name: Event Password Lockout E2E Test

on:
  pull_request:

# Pinned tool versions — keep in sync with docs/event-password-gate.md.
env:
  BUN_VERSION: "1.1.34"
  NODE_VERSION: "20.17.0"

jobs:
  event-password-lockout-e2e:
    name: event-password-lockout-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Cache Bun's global install store keyed on OS + Bun version + lockfile.
      # bun.lockb is the canonical lockfile in this repo; bun.lock is the text
      # mirror and is included so either being updated busts the cache.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lockb', 'bun.lock', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run e2e lockout test (with limited retries for transient flakes)
        id: e2e
        run: bun run test:e2e:lockout:ci | tee e2e-lockout.log

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: event-password-lockout-e2e-logs
          path: |
            e2e-lockout.log
          if-no-files-found: warn
          retention-days: 14
